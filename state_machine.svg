<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", "Malgun Gothic", sans-serif; fill: #172033; }
      .title { font-size: 22px; font-weight: 700; }
      .state { fill: #e8f1ff; stroke: #3166ad; stroke-width: 2; }
      .state-sleep { fill: #edf0f5; stroke: #596579; stroke-width: 2; }
      .label { font-size: 16px; }
      .hint { font-size: 14px; fill: #475569; }
      .arrow { fill: none; stroke: #334155; stroke-width: 2; marker-end: url(#arrow); }
      .panel { fill: #fff; stroke: #cbd5e1; stroke-width: 1.5; }
    </style>
  </defs>
  <rect width="1000" height="500" fill="#f8fafc"/>
  <rect class="panel" x="20" y="20" width="440" height="460" rx="14"/>
  <rect class="panel" x="480" y="20" width="500" height="460" rx="14"/>

  <text class="title" x="240" y="62" text-anchor="middle">변경 전 상태 머신</text>
  <rect class="state" x="60" y="165" width="150" height="70" rx="35"/>
  <text class="label" x="135" y="208" text-anchor="middle">IDLE</text>
  <rect class="state-sleep" x="280" y="165" width="150" height="70" rx="35"/>
  <text class="label" x="355" y="208" text-anchor="middle">SLEEP</text>
  <path class="arrow" d="M210 180 C235 145 255 145 280 180"/>
  <text class="label" x="245" y="132" text-anchor="middle">5초 경과</text>
  <path class="arrow" d="M280 220 C255 255 235 255 210 220"/>
  <text class="label" x="245" y="282" text-anchor="middle">Space</text>

  <text class="title" x="730" y="62" text-anchor="middle">변경 후 상태 머신</text>
  <rect class="state" x="515" y="170" width="135" height="70" rx="35"/>
  <text class="label" x="582" y="213" text-anchor="middle">IDLE</text>
  <rect class="state" x="690" y="170" width="135" height="70" rx="35"/>
  <text class="label" x="757" y="213" text-anchor="middle">RUN</text>
  <rect class="state-sleep" x="840" y="320" width="135" height="70" rx="35"/>
  <text class="label" x="907" y="363" text-anchor="middle">SLEEP</text>

  <path class="arrow" d="M650 180 C665 150 675 150 690 180"/>
  <text class="hint" x="670" y="132" text-anchor="middle">좌/우 누름</text>
  <path class="arrow" d="M690 230 C675 260 665 260 650 230"/>
  <text class="hint" x="670" y="288" text-anchor="middle">키 뗌 / 화면 끝</text>
  <path class="arrow" d="M610 240 C630 330 780 390 840 365"/>
  <text class="hint" x="700" y="355" text-anchor="middle">5초 경과</text>
  <path class="arrow" d="M840 335 C775 300 650 300 610 240"/>
  <text class="hint" x="730" y="312" text-anchor="middle">Space</text>
  <path class="arrow" d="M875 320 C855 260 825 235 800 220"/>
  <text class="hint" x="870" y="275" text-anchor="middle">좌/우 누름</text>

  <text class="hint" x="730" y="430" text-anchor="middle">RUN은 하나의 상태이며 dir 값으로 좌/우 이동</text>
  <text class="hint" x="730" y="454" text-anchor="middle">IDLE 복귀 시 수면 타이머 재시작</text>
</svg>
